<li class="mb-12">
    <div class="group relative grid pb-1 transition-all sm:grid-cols-8 sm:gap-8 md:gap-4 lg:hover:!opacity-100 lg:group-hover/list:opacity-50">
      <div
        class="absolute -inset-x-4 -inset-y-4 z-0 hidden rounded-md transition motion-reduce:transition-none lg:-inset-x-6 lg:block lg:group-hover:bg-slate-800/50 lg:group-hover:shadow-[inset_0_1px_0_0_rgba(148,163,184,0.1)] lg:group-hover:drop-shadow-lg"
      ></div>
      
      <header
        class="z-10 mb-2 mt-1 text-xs font-semibold uppercase tracking-wide text-slate-500 sm:col-span-2"
        aria-label="2024 to Present"
      >
        <ngx-skeleton-loader class="h-4 w-24 rounded" [theme]="{ 'background-color': '#334155' }"></ngx-skeleton-loader>
      </header>
  
      <div class="z-10 sm:col-span-6">
        <h3 class="font-medium leading-snug text-slate-200">
          <div>
            <ngx-skeleton-loader class="h-6 w-48 rounded" [theme]="{ 'background-color': '#334155' }"></ngx-skeleton-loader>
          </div>
        </h3>

        <p class="mt-2 text-sm leading-normal text-slate-400">
          <ngx-skeleton-loader class="h-4 w-full rounded mb-2" [theme]="{ 'background-color': '#334155','height':'80px' }"></ngx-skeleton-loader>
        </p>
  
        <ul class="mt-2 flex flex-wrap" aria-label="Technologies used">
          @for(tech of [1, 2, 3, 4, 5, 6]; track tech) {
            <li class="mr-1.5 mt-2">
              <ngx-skeleton-loader 
                [theme]="{ 'background-color': '#334155', 'width': '60px', 'height': '30px', 'border-radius': '1rem' }">
              </ngx-skeleton-loader>
            </li>
          }
        </ul>
      </div>
    </div>
  </li>
