<header>
  <div>
    <h2 class="text-lg text-teal-300">Hi, my name is</h2>
    <h1
      class="mt-3 typing-demo text-4xl font-bold tracking-tight text-slate-200 sm:text-5xl"
    >
      <a href="/">Francisco Soares</a>
    </h1>
    <h2
      class="mt-3 text-lg font-medium tracking-tight text-slate-200 sm:text-xl"
    >
      Software Engineer / Frontend Developer
    </h2>
    <p class="mt-4 max-w-xs leading-normal text-slate-400">
      Experienced with the most modern techs in web development. I am always
      willing to learn more.
    </p>
    <img
      class="rounded-lg mt-4 w-full lg:w-[300px]"
      width="500"
      src="./profileImg.png"
      alt=""
    />
    <nav class="nav hidden lg:block" aria-label="In-page jump links">
      <ul class="mt-16 w-max">
        <li>
          <a
            class="group flex items-center py-3 active"
            href="#about"
            [class.active]="activeSection() === 'about'"
            ><span
              class="nav-indicator mr-4 h-px w-8 bg-slate-600 transition-all group-hover:w-16 group-hover:bg-slate-200 group-focus-visible:w-16 group-focus-visible:bg-slate-200 motion-reduce:transition-none"
              [ngClass]="{
                'bg-slate-200 w-16': activeSection() === 'about',
                'bg-slate-600': activeSection() !== 'about'
              }"
              ></span
            ><span
              class="nav-text text-xs font-bold uppercase tracking-widest text-slate-500 group-hover:text-slate-200 group-focus-visible:text-slate-200"
              [ngClass]="{
                'text-slate-200': activeSection() === 'about',
                'text-slate-500': activeSection() !== 'about'
              }"
              >About</span
            ></a
          >
        </li>
        <li>
          <a
            class="group flex items-center py-3"
            href="#experience"
            [class.active]="activeSection() === 'experience'"
            ><span
              class="nav-indicator mr-4 h-px w-8 bg-slate-600 transition-all group-hover:w-16 group-hover:bg-slate-200 group-focus-visible:w-16 group-focus-visible:bg-slate-200 motion-reduce:transition-none"
              [ngClass]="{
                'bg-slate-200 w-16': activeSection() === 'experience',
                'bg-slate-600': activeSection() !== 'experience'
              }"
              ></span
            ><span
              class="nav-text text-xs font-bold uppercase tracking-widest text-slate-500 group-hover:text-slate-200 group-focus-visible:text-slate-200"
              [ngClass]="{
                'text-slate-200': activeSection() === 'experience',
                'text-slate-500': activeSection() !== 'experience'
              }"
              >Experience</span
            ></a
          >
        </li>
        <li>
          <a class="group flex items-center py-3" href="#projects" [class.active]="activeSection() === 'projects'"
            ><span
              class="nav-indicator mr-4 h-px w-8 bg-slate-600 transition-all group-hover:w-16 group-hover:bg-slate-200 group-focus-visible:w-16 group-focus-visible:bg-slate-200 motion-reduce:transition-none"
              [ngClass]="{
                'bg-slate-200 w-16': activeSection() === 'projects',
                'bg-slate-600': activeSection() !== 'projects'
              }"
              ></span
            ><span
              class="nav-text text-xs font-bold uppercase tracking-widest text-slate-500 group-hover:text-slate-200 group-focus-visible:text-slate-200"
              [ngClass]="{
                'text-slate-200': activeSection() === 'projects',
                'text-slate-500': activeSection() !== 'projects'
              }"
              >Projects</span
            ></a
          >
        </li>
      </ul>
    </nav>
  </div>
  <ul
    class="ml-1 mt-8 flex items-center text-slate-500"
    aria-label="Social media"
  >
    <li class="mr-5 shrink-0 text-xs">
      <a
        class="block hover:text-slate-200"
        href="https://github.com/FranciscoSoares0"
        target="_blank"
        rel="noreferrer noopener"
        aria-label="GitHub (opens in a new tab)"
        title="GitHub"
        ><span class="sr-only">GitHub</span
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16"
          fill="currentColor"
          class="h-6 w-6"
          aria-hidden="true"
        >
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          ></path></svg
      ></a>
    </li>
    <li class="mr-5 shrink-0 text-xs">
      <a
        class="block hover:text-slate-200"
        href="https://www.linkedin.com/in/francisco-soares-a2871b211/"
        target="_blank"
        rel="noreferrer noopener"
        aria-label="LinkedIn (opens in a new tab)"
        title="LinkedIn"
        ><span class="sr-only">LinkedIn</span
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="h-6 w-6"
          aria-hidden="true"
        >
          <path
            d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z"
          ></path></svg
      ></a>
    </li>
  </ul>
</header>
