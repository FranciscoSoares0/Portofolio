<li class="mb-12">
    <div class="group relative grid gap-4 pb-1 transition-all sm:grid-cols-8 sm:gap-8 md:gap-4">
      <div class="absolute -inset-x-4 -inset-y-4 z-0 hidden rounded-md transition motion-reduce:transition-none lg:-inset-x-6 lg:block lg:group-hover:bg-slate-800/50 lg:group-hover:shadow-[inset_0_1px_0_0_rgba(148,163,184,0.1)] lg:group-hover:drop-shadow-lg"></div>
    
      <div class="z-10 sm:order-2 sm:col-span-6">
        <ngx-skeleton-loader class="h-6 w-40 rounded" [theme]="{ 'background-color': '#334155', 'width':'150px' }"></ngx-skeleton-loader>
  
        <p class="mt-2 text-sm leading-normal text-slate-400">
          <ngx-skeleton-loader class="h-4 w-full rounded mb-2" [theme]="{ 'background-color': '#334155', 'height':'80px' }"></ngx-skeleton-loader>
        </p>
  
        <ul class="ml-1 mt-8 flex items-center text-slate-500" aria-label="Project Links">
          <li class="mr-5 shrink-0 text-xs">
            <ngx-skeleton-loader appearance="circle" [theme]="{ 'background-color': '#334155' }"></ngx-skeleton-loader>
          </li>
          <li class="mr-5 shrink-0 text-xs">
            <ngx-skeleton-loader appearance="circle" [theme]="{ 'background-color': '#334155' }"></ngx-skeleton-loader>
          </li>
        </ul>
  
        <ul class="mt-2 flex flex-wrap" aria-label="Technologies used">
          @for(tech of [1, 2, 3, 4, 5, 6]; track tech) {
            <li class="mr-1.5 mt-2">
              <ngx-skeleton-loader [theme]="{ 'background-color': '#334155', 'width': '60px', 'height': '30px', 'border-radius': '1rem' }"></ngx-skeleton-loader>
            </li>
          }
        </ul>
      </div>
  
      <div class="sm:order-1 sm:col-span-2 sm:translate-y-1 group-hover:opacity-50 transition-all">
        <div class="w-full aspect-video min-h-[120px]">
          <ngx-skeleton-loader 
            [theme]="{
              'background-color': '#334155',
              'width': '100%',
              'height': '100%',
              'border-radius': '0.5rem'
            }">
          </ngx-skeleton-loader>
        </div>
      </div>
    </div>
  </li>
