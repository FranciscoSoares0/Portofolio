<li class="mb-12">
  <div
    class="group relative grid gap-4 pb-1 transition-all sm:grid-cols-8 sm:gap-8 md:gap-4 lg:hover:!opacity-100 lg:group-hover/list:opacity-50"
  >
    <div
      class="absolute -inset-x-4 -inset-y-4 z-0 hidden rounded-md transition motion-reduce:transition-none lg:-inset-x-6 lg:block lg:group-hover:bg-slate-800/50 lg:group-hover:shadow-[inset_0_1px_0_0_rgba(148,163,184,0.1)] lg:group-hover:drop-shadow-lg"
    ></div>
    <div class="z-10 sm:order-2 sm:col-span-6">
      <h3>
        <span
          class="absolute pointer-events-none -inset-x-4 -inset-y-2.5 hidden rounded md:-inset-x-6 md:-inset-y-4 lg:block"
        ></span
        ><span class="text-slate-200">{{ project()?.name }} </span>
      </h3>
      <p class="mt-2 text-sm leading-normal text-slate-400">
        {{ project()?.description }}
      </p>
      <ul
        class="ml-1 mt-8 flex items-center text-slate-500"
        aria-label="Project Links"
      >
        <li class="mr-5 shrink-0 text-xs">
          <a
            class="block hover:text-slate-200"
            [href]="project()?.gitHubLink"
            target="_blank"
            aria-label="GitHub (opens in a new tab)"
            title="GitHub Link"
            ><span class="sr-only">GitHub</span
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="h-6 w-6"
              aria-hidden="true"
            >
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              ></path>
            </svg>
          </a>
        </li>
        @if(project()?.appLink){
        <li class="mr-5 shrink-0 text-xs">
          <a
            class="block hover:text-slate-200"
            [href]="project()?.appLink"
            target="_blank"
            aria-label="App Link (opens in a new tab)"
            title="{{ project()?.name }} Link"
            ><span class="sr-only">App link</span
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="h-7 w-7"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M18 13.5V18a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 18V8.25A2.25 2.25 0 016.75 6h4.5M15 3h6m0 0v6m0-6L10.5 13.5"
              />
            </svg>
          </a>
        </li>
        }
      </ul>
      <ul class="mt-2 flex flex-wrap" aria-label="Technologies used">
        @for(tech of project()?.techs; track tech){
        <li class="mr-1.5 mt-2">
          <div
            class="flex items-center rounded-full bg-teal-400/10 px-3 py-1 text-xs font-medium leading-5 text-teal-300"
          >
            {{ tech }}
          </div>
        </li>
        }
      </ul>
    </div>
    <img
      width="500"
      height="48"
      class="aspect-video rounded border-2 border-slate-200/10 transition group-hover:border-slate-200/30 sm:order-1 sm:col-span-2 sm:translate-y-1"
      style="color: transparent"
      [src]="(project()?.images)![0]"
    />
  </div>
</li>
